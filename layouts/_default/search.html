<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <link rel="icon" href= {{ .Site.Params.favicon }} />
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}" />
    <link rel="stylesheet" href="{{ "css/fonts.css" | relURL }}" />
  </head>

  <body>
    <nav>
    <ul class="menu">
      {{ range .Site.Menus.main }}
      <li><a href="{{ .URL | relURL }}">{{ .Name }}</a></li>
      {{ end }}
    </ul>
    <hr/>
    </nav>

<script type="application/json" class="search-index">
  {{ $pages := where site.RegularPages "Type" "posts" }}
  {{ if eq (len $pages) 0 }}
    {{ $pages = where site.RegularPages "Section" "!=" "" }}
  {{ end }}
  [
    {{ range $index, $page := $pages }}
    {{ if $index }},{{ end }}
    {
      "title": {{ $page.Title | jsonify }},
      "permalink": {{ $page.RelPermalink | jsonify }},
      "content": {{ $page.Plain | jsonify }},
      "categories": {{ if $page.Params.categories }}{{ $page.Params.categories | jsonify }}{{ else }}[]{{ end }},
      "tags": {{ if $page.Params.tags }}{{ $page.Params.tags | jsonify }}{{ else }}[]{{ end }},
      "series": {{ if $page.Params.series }}{{ $page.Params.series | jsonify }}{{ else }}[]{{ end }},
      "date": {{ $page.Date.Format "2006-01-02" | jsonify }}
    }
    {{ end }}
  ]
</script>

<p style="margin: 1.8rem 0 -1rem 0; color: #191919;" id="search-hint">可以根据标题、分类、标签、系列等条目检索本站文章 | 快捷键: Ctrl+K / Ctrl+Shift+F</p>

<div class="search-container">
  <input type="text" id="search-input" placeholder="输入关键词搜索..." aria-label="搜索框" autocomplete="off">
  <div id="search-debug" style="margin-bottom: 10px; color: #999;"></div>
  <div id="search-results"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>

<script>
(function() {
  function debug(text) {
    document.getElementById('search-debug').textContent = text;
  }
  function showpages() {
    debug("当前本站共有 " + window.searchIndex.length + " 篇文章");
  }
  window.showpages = showpages;

  function initSearchIndex() {
    const pages = document.querySelectorAll('script[type="application/json"].search-index');
    if (pages.length === 0) return;
    try {
      window.searchIndex = JSON.parse(pages[0].textContent);
    } catch(e) {
      console.error('Failed to parse search index:', e);
      window.searchIndex = [];
    }
  }

  function highlightMatch(text, query) {
    if (!query || !text) return text;
    const regex = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return text.replace(regex, '<mark>$1</mark>');
  }

  function searchAndRender(searchTerm, resultsContainer) {
    resultsContainer.innerHTML = '';
    if (searchTerm === '') {
      showpages();
      return;
    }

    const results = window.fuse.search(searchTerm);

    results.sort((a, b) => {
      const scoreA = a.score || 1;
      const scoreB = b.score || 1;
      if (scoreA !== scoreB) return scoreA - scoreB;
      const titleMatchA = (a.item.title || '').toLowerCase().includes(searchTerm.toLowerCase());
      const titleMatchB = (b.item.title || '').toLowerCase().includes(searchTerm.toLowerCase());
      if (titleMatchA !== titleMatchB) return titleMatchA ? -1 : 1;
      return new Date(b.item.date) - new Date(a.item.date);
    });

    if (results.length === 0) {
      showpages();
      resultsContainer.innerHTML = '<p>没有找到相关文章</p>';
      return;
    }

    debug("共找到 " + results.length + " 篇匹配的文章");

    results.forEach(result => {
      const item = result.item;
      const resultItem = document.createElement('div');
      resultItem.className = 'search-result-item';

      const date = document.createElement('span');
      date.textContent = item.date.replace(/^"|"$/g, '') + '   ';
      date.className = 'search-result-date';

      const link = document.createElement('a');
      link.href = item.permalink.replace(/^"|"$/g, '');
      link.innerHTML = highlightMatch(item.title.replace(/^"|"$/g, ''), searchTerm);
      link.className = 'search-result-title';

      resultItem.appendChild(date);
      resultItem.appendChild(link);
      resultsContainer.appendChild(resultItem);
    });
  }

  window.initSearchIndex = initSearchIndex;
  window.searchAndRender = searchAndRender;
  window.highlightMatch = highlightMatch;

  const options = {
    includeScore: true,
    threshold: 0.4,
    keys: [
      { name: 'title', weight: 0.7 },
      { name: 'tags', weight: 0.5 },
      { name: 'categories', weight: 0.5 },
      { name: 'series', weight: 0.5 },
      { name: 'content', weight: 0.3 }
    ]
  };

  function toggleSearchModal() {
    const input = document.getElementById('search-input');
    input.focus();
  }
  window.toggleSearchModal = toggleSearchModal;

  function setupKeyboardHandler() {
    document.addEventListener('keydown', function(event) {
      if ((event.ctrlKey || event.metaKey) && event.shiftKey && event.key === 'F') {
        event.preventDefault();
        toggleSearchModal();
      } else if ((event.ctrlKey || event.metaKey) && event.key === 'k') {
        event.preventDefault();
        toggleSearchModal();
      } else if (event.key === 'Escape') {
        document.getElementById('search-input').value = "";
        var res = document.getElementById('search-results');
        while (res.firstChild) {
          res.removeChild(res.firstChild);
        }
        showpages();
        document.getElementById('search-input').focus();
      }
    }, true);
  }

  function initSearch() {
    initSearchIndex();
    if (window.searchIndex && window.searchIndex.length > 0) {
      window.fuse = new Fuse(window.searchIndex, options);
      showpages();
    }
    setupKeyboardHandler();

    document.getElementById('search-input').addEventListener('input', function(e) {
      const searchTerm = e.target.value.trim();
      const resultsContainer = document.getElementById('search-results');
      searchAndRender(searchTerm, resultsContainer);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initSearch);
  } else {
    initSearch();
  }
})();
</script>

<style>
.search-container {
    margin: 2rem 0;
    text-align: left;
}

#search-input {
    width: 100%;
    padding: 0.8rem;
    font-size: 1rem;
    border: 1px solid #ddd;
    border-radius: 4px;
    margin-bottom: 1rem;
}

.search-results-list {
    list-style: none;
    padding: 0;
    margin: 1rem 0;
}

.search-result-item {
    padding: 0.7rem;
    margin-bottom: 0.5rem;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
}

.search-result-date {
    color: #666;
    font-size: 1.1rem;
    margin-right: 0.5rem;
    text-wrap: nowrap;
}

.search-result-title {
    font-weight: bold;
    color: #1a73e8;
    text-decoration: none;
}

.search-result-title:hover {
    text-decoration: underline;
}

.search-result-title mark {
    background-color: #fff3cd;
    color: #856404;
    padding: 0 2px;
    border-radius: 2px;
}
</style>

<footer>
  {{ with .Site.Params.footer }}
  <hr />
  {{ replace . "{Year}" now.Year | markdownify }}
  {{ end }}

</footer>
</body>

</html>

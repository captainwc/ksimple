<div id="search-modal">
  <input type="text" id="modal-search-input" placeholder="输入关键词搜索..." aria-label="搜索框" autocomplete="off">
  <div id="modal-search-debug" style="margin-bottom: 10px; color: #999;"></div>
  <div id="modal-search-results"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>

<script>
(function() {
  function debug(text) {
      document.getElementById('modal-search-debug').textContent = text;
  }
  function showpages() {
    debug("当前本站共有 " + window.searchIndex.length + " 篇文章");
  }
  window.showpages = showpages;

  function initSearchIndex() {
    const pages = document.querySelectorAll('script[type="application/json"].search-index');
    if (pages.length === 0) return;
    try {
      window.searchIndex = JSON.parse(pages[0].textContent);
    } catch(e) {
      console.error('Failed to parse search index:', e);
      window.searchIndex = [];
    }
  }

  function highlightMatch(text, query) {
    if (!query || !text) return text;
    const regex = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return text.replace(regex, '<mark>$1</mark>');
  }

  function searchAndRender(searchTerm, resultsContainer, options) {
    resultsContainer.innerHTML = '';
    if (searchTerm === '') {
      showpages();
      return;
    }

    const results = window.fuse.search(searchTerm);

    results.sort((a, b) => {
      const scoreA = a.score || 1;
      const scoreB = b.score || 1;
      if (scoreA !== scoreB) return scoreA - scoreB;
      const titleMatchA = (a.item.title || '').toLowerCase().includes(searchTerm.toLowerCase());
      const titleMatchB = (b.item.title || '').toLowerCase().includes(searchTerm.toLowerCase());
      if (titleMatchA !== titleMatchB) return titleMatchA ? -1 : 1;
      return new Date(b.item.date) - new Date(a.item.date);
    });

    if (results.length === 0) {
      showpages();
      resultsContainer.innerHTML = '<p>没有找到相关文章</p>';
      return;
    }

    debug("共找到 " + results.length + " 篇匹配的文章");

    results.forEach(result => {
      const item = result.item;
      const resultItem = document.createElement('div');
      resultItem.className = 'modal-search-result-item';

      const date = document.createElement('span');
      date.textContent = item.date.replace(/^"|"$/g, '') + '   ';
      date.className = 'modal-search-result-date';

      const link = document.createElement('a');
      link.href = item.permalink.replace(/^"|"$/g, '');
      link.innerHTML = highlightMatch(item.title.replace(/^"|"$/g, ''), searchTerm);
      link.className = 'modal-search-result-title';

      resultItem.appendChild(date);
      resultItem.appendChild(link);
      resultsContainer.appendChild(resultItem);
    });
  }

  window.initSearchIndex = initSearchIndex;
  window.searchAndRender = searchAndRender;
  window.highlightMatch = highlightMatch;

  const options = {
    includeScore: true,
    threshold: 0.4,
    keys: [
      { name: 'title', weight: 0.7 },
      { name: 'tags', weight: 0.5 },
      { name: 'categories', weight: 0.5 },
      { name: 'series', weight: 0.5 },
      { name: 'content', weight: 0.3 }
    ]
  };

  function setupKeyboardHandler() {
    document.addEventListener('keydown', function(event) {
      if ((event.ctrlKey || event.metaKey) && event.shiftKey && event.key === 'F') {
        event.preventDefault();
        toggleSearchModal();
      } else if ((event.ctrlKey || event.metaKey) && event.key === 'k') {
        event.preventDefault();
        toggleSearchModal();
      } else if (event.key === 'Escape') {
        document.getElementById('modal-search-input').value = "";
        closeSearchModal();
        var res = document.getElementById('modal-search-results');
        while (res.firstChild) {
          res.removeChild(res.firstChild);
        }
        showpages();
      }
    }, true);
  }

  function toggleSearchModal() {
    const modal = document.getElementById('search-modal');
    if (modal.style.display === 'none' || modal.style.display === '') {
      modal.style.display = 'block';
      setTimeout(function() {
        document.getElementById('modal-search-input').focus();
      }, 10);
    } else {
      modal.style.display = 'none';
    }
  }
  window.toggleSearchModal = toggleSearchModal;

  function closeSearchModal() {
    const modal = document.getElementById('search-modal');
    modal.style.display = 'none';
  }
  window.closeSearchModal = closeSearchModal;

  function initSearch() {
    initSearchIndex();
    if (window.searchIndex && window.searchIndex.length > 0) {
      window.fuse = new Fuse(window.searchIndex, options);
      showpages();
    }
    setupKeyboardHandler();

    document.getElementById('modal-search-input').addEventListener('input', function(e) {
      const searchTerm = e.target.value.trim();
      const resultsContainer = document.getElementById('modal-search-results');
      searchAndRender(searchTerm, resultsContainer);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initSearch);
  } else {
    initSearch();
  }
})();
</script>

<style>
/* Ctrl+K 唤起浮动搜索框样式 */
#search-modal {
    display: none;
    position: fixed;
    top: 6%;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    padding: 20px;
    box-shadow: 0 0 6px rgba(45, 45, 45, 0.5);
    border-radius: 6px;
    z-index: 1000;
    width: 80%;
    max-width: 600px;
    text-align: left;
}

#modal-search-input {
    width: 100%;
    padding: 10px;
    box-sizing: border-box;
    font-size: 1rem;
    border: 1px solid #ddd;
    border-radius: 4px;
    margin-bottom: 1rem;
}

#modal-search-results {
    margin-top: 10px;
    max-height: 60vh;
    overflow-y: auto;
}

.modal-search-result-item {
    padding: 0.7rem;
    margin-bottom: 0.5rem;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
}

.modal-search-result-date {
    color: #666;
    font-size: 1.1rem;
    margin-right: 0.5rem;
    text-wrap: nowrap;
}

.modal-search-result-title {
    font-weight: bold;
    color: #1a73e8;
    text-decoration: none;
}

.modal-search-result-title:hover {
    text-decoration: underline;
}

.modal-search-result-title mark {
    background-color: #fff3cd;
    color: #856404;
    padding: 0 2px;
    border-radius: 2px;
}
</style>
